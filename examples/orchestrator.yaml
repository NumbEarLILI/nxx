# 示例配置：agent 注册、敏感分类规则与一个混合级别的任务 DAG

levels: [L0, L1, L2, L3]

agents:
  - id: opencode-trusted
    adapter: opencode
    mode: acp                      # acp | cli | http
    command: ["opencode", "acp"]
    model_endpoint: http://127.0.0.1:11434   # 本地模型；clearance 取决于它
    clearance: L3
    capabilities: [code, refactor, review, security, shell]
    max_concurrency: 1
    zone: trusted
    sandbox:
      image: agents/opencode:latest
      network: model-endpoint-only
      secrets: [PAYMENT_SIGNING_KEY]

  - id: claude-code
    adapter: claude-code
    mode: cli
    command: ["claude", "-p", "{prompt}", "--output-format", "stream-json"]
    clearance: L1
    capabilities: [code, review, docs, frontend]
    max_concurrency: 3
    zone: general
    sandbox:
      image: agents/claude-code:latest
      network: default
      sparse_exclude: ["secrets/**", "payment/signing/**", "infra/prod/**"]

  - id: codex
    adapter: codex
    mode: cli
    command: ["codex", "exec", "{prompt}"]
    clearance: L1
    capabilities: [code, test]
    max_concurrency: 2
    zone: general

classification:                    # 只能上调任务级别，不能下调
  paths:
    - { glob: "secrets/**",         level: L3 }
    - { glob: "payment/signing/**", level: L3 }
    - { glob: "infra/prod/**",      level: L2 }
  content:
    - { detector: secret-regex,     level: L3 }
    - { detector: pii,              level: L2 }

declassify:
  L3: { require_human: true,  scanners: [secret-regex, pii] }
  L2: { require_human: false, scanners: [secret-regex, pii], reviewer_clearance: L2 }

workflow:
  id: add-payment-method
  tasks:
    - id: contract
      title: 定义新支付方式的接口契约（不含密钥与签名细节）
      level: L1
      requires: [code]

    - id: signing
      title: 实现回调签名与密钥加载
      level: L3
      requires: [code, security]
      depends_on: [contract]
      review: { by_capability: security, min_reviewers: 1 }
      acceptance:
        - cmd: "pnpm test payment/signing"

    - id: ui
      title: 结算页新增支付方式入口
      level: L1
      requires: [frontend]
      depends_on: [contract]

    - id: tests
      title: 为 UI 与接口契约补充测试
      level: L1
      requires: [test]
      depends_on: [ui]

    - id: integration-review
      title: 整体评审（只读 L1 产物；signing 只提供降级后的摘要）
      level: L1
      requires: [review]
      inputs: ["artifact://ui", "artifact://tests", "declassified://signing"]
      depends_on: [signing, tests]
